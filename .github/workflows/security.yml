# Canonical Stage 1 secrets, SAST, and dependency controls.
name: Security

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.174.0
    steps:
      - uses: actions/checkout@v5
      - run: semgrep scan --config=p/typescript --config=p/react --config=p/secrets --error --quiet

  deps-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm audit --audit-level=high
