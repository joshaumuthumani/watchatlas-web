name: Refresh Graphify report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - graphify-out/GRAPH_REPORT.md

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: graphify-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    # Runs only for trusted main pushes or an explicitly dispatched trusted run.
    if: github.event_name == 'push' || github.repository_owner == github.actor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Graphify
        run: pip install graphifyy
      - name: Refresh report after source changes
        run: graphify update . --force
      - name: Create a rule-compliant report refresh PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/graphify-refresh-${{ github.run_id }}
        run: |
          if git diff --quiet -- graphify-out/GRAPH_REPORT.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add graphify-out/GRAPH_REPORT.md
          git commit -m 'chore: refresh Graphify report'
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title 'chore: refresh Graphify report' --body 'Automated trusted CI refresh of the tracked Graphify report. Machine-specific Graphify artifacts remain untracked.'
