name: Refresh Graphify report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - graphify-out/GRAPH_REPORT.md

permissions:
  contents: write

concurrency:
  group: graphify-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    # Do not grant a forked pull request write access. The report is refreshed
    # only from trusted main or an explicitly dispatched trusted workflow.
    if: github.repository_owner == github.actor || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Graphify
        run: pip install graphifyy
      - name: Refresh report after source changes
        run: graphify update . --force
      - name: Commit the CI-owned report
        run: |
          if git diff --quiet -- graphify-out/GRAPH_REPORT.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graphify-out/GRAPH_REPORT.md
          git commit -m 'chore: refresh Graphify report'
          git push
