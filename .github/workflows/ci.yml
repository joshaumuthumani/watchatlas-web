# Canonical Stage 1 quality gate, adapted for WatchAtlas's Next.js stack.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run unit tests
        run: npm run test
      - name: Build project
        # The production source of truth is Phase -> Vercel. CI needs only
        # non-secret Firebase web identifiers to exercise Next static generation.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-build-only
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-build.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-build
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-build.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:cibuild"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-build.apps.googleusercontent.com
        run: npm run build
